# Grafana's database, so several Grafana replicas can share users, sessions
# and settings. Two instances, one per worker: a primary and a streaming
# replica that CloudNativePG promotes if the primary's node fails.
#
# CloudNativePG creates the grafana-db-app Secret (username, password, ...)
# that Grafana reads, and the grafana-db-rw Service that always points at the
# current primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: observability
spec:
  instances: 2
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  # Sized for WAL, not data: Grafana's data is small, but CloudNativePG keeps
  # up to max_wal_size (1GB) plus wal_keep_size (512MB) of WAL, and
  # archive_timeout forces a new 16MB segment every 5 minutes. At 2Gi both
  # instances ran out of space and refused to start.
  storage:
    storageClass: truenas-nvmeof
    size: 8Gi
  # Never put both instances on one node.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
