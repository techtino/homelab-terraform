# PVCs use Delete: deleting a claim deletes its volume and data on TrueNAS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nvmeof
provisioner: csi.truenas.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  protocol: nvmeof
  pool: FastNAS
  datasetPath: kubernetes/volumes
  sparse: "true"
