# LAN addresses MetalLB hands out to LoadBalancer Services. Traefik uses
# 192.168.1.241 (gitops/apps/traefik.yaml).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: home-lan
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: home-lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - home-lan
