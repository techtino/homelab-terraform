apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The KubeVirt operator from upstream, plus the KubeVirt resource that makes it
# deploy virt-api, virt-controller and virt-handler. Bump the version here to
# upgrade; the operator then updates the rest itself.
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - kubevirt.yaml
