# An example Debian 13 VM with its disk on TrueNAS. On first boot CDI creates
# a truenas-nvmeof PVC (debian-root) and copies the Debian cloud image onto it;
# after that the VM boots from the PVC, so its data survives restarts.
#
# Deleting this VM deletes the PVC and its data (the storage class uses
# reclaimPolicy: Delete).
#
#   virtctl console debian -n vms
#   virtctl ssh debian@vm/debian -n vms
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: debian
  namespace: vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: debian-root
      spec:
        source:
          http:
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        storage:
          storageClassName: truenas-nvmeof
          # CDI has no storage profile for the TrueNAS driver, so say what it
          # supports: one node at a time, mounted as a filesystem.
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      labels:
        app: debian
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
            - name: cloud-init
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      # Adds the keys in the vm-ssh-keys Secret to the debian user.
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: vm-ssh-keys
            propagationMethod:
              noCloud: {}
      volumes:
        - name: root
          dataVolume:
            name: debian-root
        - name: cloud-init
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: debian
              hostname: debian
              package_update: true
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
