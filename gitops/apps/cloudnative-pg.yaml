# CloudNativePG, the operator that runs PostgreSQL clusters: a primary plus
# streaming replicas, with automatic failover. Databases themselves are Cluster
# resources next to the app that uses them, e.g. grafana-db
# (gitops/manifests/observability/grafana-db.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      releaseName: cnpg
      valuesObject:
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 256Mi }
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for client-side apply.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
