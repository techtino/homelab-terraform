# The whole metrics, logs and alerting stack: VictoriaMetrics and VictoriaLogs
# storage, collectors, vmalert, Alertmanager and Grafana. The chart wires the
# components (remote write, alert datasources, Grafana datasources) to each
# other. gitops/manifests/observability adds the homelab dashboards and the
# Traefik, cert-manager and CloudNativePG scrapes and alerts.
#
# The namespace and the alertmanager-config and grafana-admin Secrets are
# created by OpenTofu (kubernetes/observability.tf), so no credentials are in
# Git.
#
# Resource requests are close to observed usage so the scheduler can place pods
# by real load. Memory limits stop a leak from exhausting a node. No CPU limits,
# which would only cause throttling.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.96.0
      helm:
        releaseName: vm-k8s-stack
        valuesObject:
          vmsingle:
            enabled: true
            name: vmsingle
            spec:
              retentionPeriod: "1" # months
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 2Gi }
              storage:
                storageClassName: truenas-nvmeof
                resources:
                  requests:
                    storage: 100Gi

          vlsingle:
            enabled: true
            name: vlogs
            spec:
              retentionPeriod: 7d
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 1Gi }
              storage:
                storageClassName: truenas-nvmeof
                resources:
                  requests:
                    storage: 100Gi

          # Trace storage. Ingests OTLP at
          # http://vtsingle-vtraces.observability.svc:10428/insert/opentelemetry/v1/traces
          # and is added to Grafana as a Jaeger datasource (Explore →
          # VictoriaTraces).
          vtsingle:
            enabled: true
            name: vtraces
            spec:
              retentionPeriod: 7d
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 1Gi }
              storage:
                storageClassName: truenas-nvmeof
                resources:
                  requests:
                    storage: 50Gi

          # Runs on every node, including control planes, and ships all
          # container logs to VictoriaLogs.
          vlagent:
            enabled: true
            name: vlagent
            spec:
              k8sCollector:
                enabled: true
                # Fields used as the log message, first match wins. The
                # default is message, msg, log; Traefik's JSON access log has
                # an empty msg and no RequestLine, so its RequestPath goes
                # first.
                msgFields: [RequestPath, message, msg, log]
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule

          # Evaluates the chart's default alert rules. Alert state is written
          # back to VictoriaMetrics so it survives vmalert restarts.
          vmalert:
            enabled: true
            name: vmalert
            spec:
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { memory: 512Mi }

          # A short name keeps the operator's StatefulSet name, and with it the
          # pod's controller-revision-hash label, under 63 characters.
          alertmanager:
            enabled: true
            name: alertmanager
            spec:
              configSecret: alertmanager-config
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }

          kubeEtcd:
            enabled: true
            service:
              port: 2381
              targetPort: 2381
            vmScrape:
              spec:
                endpoints:
                  - port: http-metrics
                    scheme: http
                    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tlsConfig: null

          kubeControllerManager:
            enabled: true
            vmScrape:
              spec:
                endpoints:
                  - port: http-metrics
                    scheme: https
                    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tlsConfig:
                      insecureSkipVerify: true

          kubeScheduler:
            enabled: true
            vmScrape:
              spec:
                endpoints:
                  - port: http-metrics
                    scheme: https
                    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    tlsConfig:
                      insecureSkipVerify: true

          # The chart copies every node label onto every kubelet and cAdvisor
          # series. KubeVirt adds ~380 cpu-feature/host-model labels per node,
          # pushing each series past vmsingle's label limit so all kubelet
          # metrics (container usage, volume stats, ...) were rejected. Drop
          # the KubeVirt labels first; the other three rules are the chart's
          # defaults, repeated because Helm replaces lists rather than merging.
          kubelet:
            vmScrape:
              spec:
                relabelConfigs:
                  - action: labeldrop
                    regex: __meta_kubernetes_node_label_.*kubevirt_io.*
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
                  - sourceLabels: [__metrics_path__]
                    targetLabel: metrics_path
                  - targetLabel: job
                    replacement: kubelet

          vmagent:
            enabled: true
            spec:
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }

          # The chart fills in each datasource's url. These lists replace the
          # chart's defaults, so they restate them and add trace/log links:
          # a span's "Logs for this span" opens every log line with the same
          # trace_id, and a log line's trace_id links to the trace.
          defaultDatasources:
            victoriatraces:
              datasources:
                - name: VictoriaTraces
                  access: proxy
                  uid: VictoriaTraces
                  type: jaeger
                  jsonData:
                    tracesToLogsV2:
                      datasourceUid: VictoriaLogs
                      customQuery: true
                      query: 'trace_id:="${__trace.traceId}"'
                      spanStartTimeShift: -5m
                      spanEndTimeShift: 5m
            victorialogs:
              datasources:
                - name: VictoriaLogs (DS)
                  access: proxy
                  uid: VictoriaLogs
                  type: victoriametrics-logs-datasource
                  plugin: true
                  jsonData:
                    derivedFields:
                      - name: Trace
                        matcherType: label
                        matcherRegex: trace_id
                        url: '${__value.raw}'
                        urlDisplayLabel: View trace
                        datasourceUid: VictoriaTraces

          defaultDashboards:
            enabled: true
            labels:
              grafana_dashboard: "1"

          # With both VictoriaMetrics and VictoriaLogs enabled, the chart puts a
          # vmauth in front of them as vmalert's datasource, routing LogsQL
          # queries to VictoriaLogs so rules can alert on logs too.
          internal:
            vmauth:
              spec:
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 128Mi }

          victoria-metrics-operator:
            operator:
              disable_prometheus_converter: true
            # The chart would otherwise generate a new webhook certificate on
            # every render, which Argo CD would see as a change on every sync.
            admissionWebhooks:
              certManager:
                enabled: true
            resources:
              requests: { cpu: 20m, memory: 96Mi }
              limits: { memory: 256Mi }

          kube-state-metrics:
            resources:
              requests: { cpu: 20m, memory: 96Mi }
              limits: { memory: 256Mi }

          prometheus-node-exporter:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { memory: 128Mi }

          # Datasources for VictoriaMetrics, VictoriaLogs and Alertmanager are
          # provisioned by the chart. The plugin datasources are only added
          # when their plugin is listed here.
          grafana:
            enabled: true

            # Matches the Service name the grafana route points at
            # (gitops/charts/homelab/values.yaml).
            fullnameOverride: grafana

            # Without an existing Secret the chart generates a new random
            # password on every render, which Argo CD would keep re-applying.
            admin:
              existingSecret: grafana-admin

            service:
              type: ClusterIP
              port: 80

            # Two replicas, one per worker. State lives in the grafana-db
            # PostgreSQL cluster (gitops/manifests/observability/grafana-db.yaml)
            # rather than a local volume, so either replica can serve any
            # request and sessions survive a pod moving.
            replicas: 2
            persistence:
              enabled: false
            podDisruptionBudget:
              minAvailable: 1
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
                    app.kubernetes.io/instance: vm-k8s-stack

            env:
              GF_DATABASE_TYPE: postgres
              GF_DATABASE_HOST: grafana-db-rw.observability.svc:5432
              GF_DATABASE_NAME: grafana
              GF_DATABASE_SSL_MODE: require
            envValueFrom:
              GF_DATABASE_USER:
                secretKeyRef:
                  name: grafana-db-app
                  key: username
              GF_DATABASE_PASSWORD:
                secretKeyRef:
                  name: grafana-db-app
                  key: password

            # Grafana's own alerting runs on every replica; gossip over the
            # headless Service lets them share state so notifications aren't
            # sent twice.
            headlessService: true
            grafana.ini:
              unified_alerting:
                enabled: true
                ha_peers: grafana-headless:9094
                ha_listen_address: ${POD_IP}:9094
                ha_advertise_address: ${POD_IP}:9094

            plugins:
              - victoriametrics-metrics-datasource
              - victoriametrics-logs-datasource

            resources:
              requests: { cpu: 50m, memory: 768Mi }
              limits: { memory: 1536Mi }

            # Replace one pod at a time, so one replica is always serving.
            deploymentStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1

            sidecar:
              resources:
                requests: { cpu: 10m, memory: 128Mi }
                limits: { memory: 256Mi }
              dashboards:
                searchNamespace: observability
    - repoURL: https://github.com/techtino/homelab-terraform.git
      targetRevision: main
      path: gitops/manifests/observability
  # cert-manager's cainjector fills in the operator webhook's CA bundle.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The VictoriaMetrics CRDs are too large for client-side apply's
      # last-applied annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
