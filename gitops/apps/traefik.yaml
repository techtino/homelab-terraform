# Traefik, the Gateway API implementation. The Gateway itself, with one
# certificate per routed name, is rendered by the homelab chart
# (gitops/charts/homelab) from the same list as the routes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.7.1
    helm:
      releaseName: traefik
      valuesObject:
        deployment:
          replicas: 2

        additionalArguments:
          # External services (proxmox, router, truenas) use self-signed certs.
          - --serversTransport.insecureSkipVerify=true
          # Pick up endpoint changes quickly (default 2s), so a pod that is
          # shutting down stops receiving traffic almost immediately.
          - --providers.providersThrottleDuration=200ms
          # Fail fast on an unreachable backend (default 30s) so the retry
          # middleware below can try another pod.
          - --serversTransport.forwardingTimeouts.dialTimeout=1s

        service:
          type: LoadBalancer
          spec:
            loadBalancerIP: 192.168.1.241
            # Deliver only to the Traefik pod on the node MetalLB announces
            # from: no extra hop between nodes, and Traefik sees the real
            # client IP.
            externalTrafficPolicy: Local

        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            http:
              # Strip client-supplied X-Remote-User before basic auth sets it.
              middlewares:
                - traefik-strip-remote-user@kubernetescrd
                - traefik-retry@kubernetescrd

        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
          # Used for the Middlewares below and basic auth.
          kubernetesCRD:
            enabled: true

        # The GatewayClass comes from this chart; the Gateway from the homelab
        # chart.
        gateway:
          enabled: false

        # Retry requests that couldn't reach a backend, e.g. a pod on a node
        # that has died but isn't marked NotReady yet. Applied to every route
        # on websecure. Traefik stops as soon as a backend replies (any
        # status), so a request is only re-sent if no backend answered it.
        extraObjects:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: retry
              namespace: traefik
            spec:
              retry:
                attempts: 3
                initialInterval: 100ms
          # An empty value removes the header, so apps only ever see the
          # X-Remote-User that basic auth sets.
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: strip-remote-user
              namespace: traefik
            spec:
              headers:
                customRequestHeaders:
                  X-Remote-User: ""
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Traefik's CRDs are too large for client-side apply.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
