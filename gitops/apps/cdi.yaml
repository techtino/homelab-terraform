# CDI (Containerized Data Importer), KubeVirt's companion for VM disks. It
# fills a PVC from a disk image, so a VM can boot from a TrueNAS volume
# (truenas-nvmeof) that keeps its data across restarts.
# gitops/manifests/cdi holds the operator and the CDI resource that tells it to
# install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/techtino/homelab-terraform.git
    targetRevision: main
    path: gitops/manifests/cdi
  syncPolicy:
    automated:
      # Never delete the CRDs or the CDI resource: that would delete every
      # DataVolume and the VM disks they own.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The CDI CRD comes from the operator manifest in the same sync.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
