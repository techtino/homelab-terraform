# A Minecraft server running the All the Mods 10 modpack
# (gitops/manifests/minecraft). Its namespace and CurseForge API key Secret
# are created by OpenTofu (kubernetes/minecraft.tf).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  source:
    repoURL: https://github.com/techtino/homelab-terraform.git
    targetRevision: main
    path: gitops/manifests/minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
